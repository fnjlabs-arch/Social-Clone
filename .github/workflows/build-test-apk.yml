# Social Clone — one-click TEST APK build.
#
# How to use:
#   1. Open the repo on GitHub -> Actions tab -> "Build Test APK".
#   2. Click "Run workflow".
#   3. Wait ~20-40 min. The APK is published to the fixed "test-build"
#      release, so it can be downloaded straight onto a phone from one
#      permanent link (no laptop, no ZIP):
#      https://github.com/fnjlabs-arch/Social-Clone/releases/download/test-build/social-clone-test.apk
#      (also kept in the run's Artifacts as a backup)
# The APK is a DEBUG build, signed with the repo's committed debug keystore
# (apps/weblibre/android/app/debug.keystore): every test build carries the
# SAME signing key, so a new test build installs over the previous one —
# no uninstall needed. It is NOT a Play-Store-ready release build; release
# builds still go through build.yml with the real upload key.

name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Android NDK
        run: |
          set -euo pipefail
          ANDROID_NDK_VERSION="$(
            sed -n 's/^weblibre\.ndkVersion[[:space:]]*=[[:space:]]*//p' \
              apps/weblibre/android/gradle.properties
          )"
          if [[ -z "$ANDROID_NDK_VERSION" ]]; then
            echo "Missing weblibre.ndkVersion in apps/weblibre/android/gradle.properties" >&2
            exit 1
          fi
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [[ $sdkmanager_status -ne 0 ]]; then
            exit "$sdkmanager_status"
          fi
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          } >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Go build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: ${{ runner.os }}-go-runtime-${{ hashFiles('native/go_mobile_runtime/pins.env') }}
          restore-keys: |
            ${{ runner.os }}-go-runtime-

      - name: Setup workspace dependencies
        run: |
          dart pub global activate melos 7.8.1
          melos bootstrap

      - name: Merge localizations
        run: python3 scripts/merge_l10n_arb.py

      - name: Update external assets
        run: melos run update-assets --no-select

      - name: Build components
        run: melos run build-components --no-select

      - name: Checkout native runtime sources
        run: |
          set -euo pipefail
          source native/go_mobile_runtime/pins.env

          git clone https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          git -C "$RUNNER_TEMP/sing-box" checkout "$SING_BOX_TAG"
          test "$(git -C "$RUNNER_TEMP/sing-box" rev-parse HEAD)" = "$SING_BOX_COMMIT"

          git clone https://github.com/tladesignz/IPtProxy.git "$RUNNER_TEMP/IPtProxy"
          git -C "$RUNNER_TEMP/IPtProxy" checkout "$IPTPROXY_TAG"
          test "$(git -C "$RUNNER_TEMP/IPtProxy" rev-parse HEAD)" = "$IPTPROXY_COMMIT"
          git -C "$RUNNER_TEMP/IPtProxy" submodule update --init dnstt

      - name: Build native gomobile runtime
        env:
          SING_BOX_SOURCE: ${{ runner.temp }}/sing-box
          IPTPROXY_SOURCE: ${{ runner.temp }}/IPtProxy
        run: melos run build-go-runtime --no-select

      - name: Build debug APK (alpha flavor)
        working-directory: apps/weblibre
        run: flutter build apk --debug --flavor alpha --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: social-clone-test-apk
          path: apps/weblibre/build/app/outputs/apk/alpha/debug/*.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls apps/weblibre/build/app/outputs/apk/alpha/debug/*.apk | head -1)"
          cp "$APK" social-clone-test.apk
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build social-clone-test.apk --clobber
          else
            gh release create test-build social-clone-test.apk \
              --title "Social Clone - Test APK (latest)" \
              --notes "Latest test build. Open the direct link on your phone to download and install social-clone-test.apk."
          fi
