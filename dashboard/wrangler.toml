# Social Clone license dashboard — Cloudflare Workers + D1 (free tier).
# Deploy only on Qasim's OWN Cloudflare account. No custom domain is attached;
# the Worker runs on its free *.workers.dev address.
name = "social-clone-dashboard"
main = "src/index.js"
compatibility_date = "2026-10-26"

[[d1_databases]]
binding = "DB"
database_name = "social-clone-dashboard"
